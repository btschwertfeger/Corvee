# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"

# Build documentation with Mkdocs
mkdocs:
  configuration: mkdocs.yml

# Install the package with its `docs` extra (pyproject.toml), the single
# source of truth for the mkdocs dependencies also used by local dev.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
